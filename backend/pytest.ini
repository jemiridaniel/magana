[pytest]
markers =
    ocr: heavy OCR/reading-pipeline tests (real image fixtures; Tesseract, PaddleOCR or TrOCR
        inference). Excluded from the default push/PR CI run; see .github/workflows/ocr.yml,
        which runs them when reading-pipeline code changes, plus every night in full.
    safety: fast safety rules a learner depends on (CLAUDE.md, docs/LLM_SAFETY.md). Run on every
        push in their own CI job (ci.yml, "safety") as well as in the full run: keep them fast.
    natlas_live: the nightly N-ATLaS evaluation against a real model (NATLAS_EVAL_URL); skipped
        without one (.github/workflows/natlas-eval.yml).

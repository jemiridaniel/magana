# api.magana.ng → Magana's private Hugging Face Space (docs/INFRA.md). Deployed by CI
# (.github/workflows/ci.yml, job "space"). The Space's access token is a Worker secret, HF_TOKEN,
# set once in the Cloudflare dashboard: never in this file, the repository or any app.
name = "magana-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

# The custom domain: Cloudflare makes its DNS record (delete the old "api" A record first).
routes = [{ pattern = "api.magana.ng", custom_domain = true }]

[vars]
# The Space's own address (https://<owner>-<space>.hf.space). Not a secret: it only answers with
# the token.
UPSTREAM = "https://jemiridaniel-magana-api.hf.space"
# Who may call from a browser with the sign-in cookie (the portal), and the website and the PWA.
ALLOWED_ORIGINS = "https://teachers.magana.ng,https://magana.ng,https://www.magana.ng,https://app.magana.ng"

# Simple per-address limits, per Cloudflare location (the server keeps its own, finer limits:
# backend/app/ratelimit.py). Reading a photo costs far more than anything else.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "LIMIT_HEAVY"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

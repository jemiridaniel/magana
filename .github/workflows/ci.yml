# Tests on every push and pull request. On main, once every test passes, deploy to the AWS
# server (docs/DEPLOY_AWS.md §8a): GitHub signs in to AWS with OIDC (no AWS keys stored here)
# and asks Systems Manager to run deploy/update.sh on the instance (no SSH).
# No server key is stored in GitHub: the PWA and portal are built with placeholders, which the
# server fills in.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # In the production image, so the tests see the server's Tesseract (5.5.0), not
      # Ubuntu's (5.3.4 reads the faint-print test pages differently).
      - run: docker build -q -t magana-backend backend
      - run: docker run --rm --user root -v "$PWD:/m" -w /m/backend magana-backend python -m pytest -q -p no:cacheprovider

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
        working-directory: portal
      - run: npm run lint
        working-directory: portal

  deploy:
    needs: [backend, app, portal]
    # Only main, and only once the AWS role is set up (repository variables).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: write   # the web bundle goes on the "web-build" release
      id-token: write   # OIDC sign-in to AWS
    env:
      DOMAIN: ${{ vars.MAGANA_DOMAIN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Build the PWA and teacher portal (placeholders instead of keys)
        run: |
          MAGANA_API="https://$DOMAIN" MAGANA_API_KEY=__MAGANA_API_KEY__ scripts/build-web.sh
          (cd portal && npm ci && PORTAL_BASE_PATH=/teachers NEXT_PUBLIC_API_URL="https://$DOMAIN" \
            NEXT_PUBLIC_API_KEY=__MAGANA_API_KEY__ NEXT_PUBLIC_TEACHER_KEY=__MAGANA_TEACHER_KEY__ \
            npx next build)
          mkdir -p bundle && cp -r app/build/web bundle/web && cp -r portal/out bundle/teachers
          grep -rqF __MAGANA_API_KEY__ bundle/web
          grep -rqF __MAGANA_TEACHER_KEY__ bundle/teachers
          tar -czf magana-web.tar.gz -C bundle web teachers
          echo "SUM=$(sha256sum magana-web.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Upload the bundle to the web-build release
        run: |
          gh release view web-build >/dev/null 2>&1 || gh release create web-build --prerelease \
            --title "Server web bundle (not a release)" \
            --notes "Built by CI for the server: the PWA and teacher portal, without keys."
          gh release upload web-build magana-web.tar.gz --clobber

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Update the server through Systems Manager
        env:
          INSTANCE: ${{ vars.MAGANA_INSTANCE_ID }}
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/web-build/magana-web.tar.gz"
          script="set -e; cd /home/ubuntu/srv/magana; as() { sudo -Hu ubuntu \"\$@\"; }; \
            prev=\$(as git rev-parse HEAD); as git fetch -q origin main; as git merge -q --ff-only $GITHUB_SHA; \
            as deploy/update.sh \$prev $url $SUM"
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "CI ${GITHUB_SHA:0:7}" --timeout-seconds 600 \
            --parameters "$(jq -nc --arg s "$script" '{commands: [$s], executionTimeout: ["1500"]}')" \
            --query Command.CommandId --output text)
          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "status: $status"
          [ "$status" = Success ]

      - name: Check from outside
        run: |
          curl -fsS --max-time 10 "https://$DOMAIN/health"; echo
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$DOMAIN/read")
          [ "$code" = 401 ] || { echo "a call without the key gave $code, not 401"; exit 1; }
          curl -fsS -o /dev/null "https://$DOMAIN/app/"

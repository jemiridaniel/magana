# Tests on every push and pull request (backend on SQLite and Postgres, app, portal, website, the
# api.magana.ng Worker). On main, once every test passes, two deploys run side by side:
# - pages: the website, the PWA and the teacher portal go to Cloudflare Pages
#   (docs/DEPLOY_PAGES.md). Built here; the PWA carries MAGANA_WEB_API_KEY, the public web key
#   (a GitHub secret). The APK key never comes to GitHub.
# - space: the API goes to the private Hugging Face Space (docs/DEPLOY.md): the bundle is pushed to
#   the Space's repository, the Worker on api.magana.ng is deployed, and the job waits until
#   https://api.magana.ng/health answers from the new commit with its database working.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:  # scripts/publish-apk.sh: redeploy the website with the new APK

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # The test-phase database is Postgres (Neon or Supabase): every test runs on it too.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: magana
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # In a server-like image, so the tests see the server's Tesseract (5.5.0), not
      # Ubuntu's (5.3.4 reads the faint-print test pages differently).
      - run: docker build -q -t magana-backend backend
      - name: Tests on SQLite
        run: docker run --rm --user root -v "$PWD:/m" -w /m/backend magana-backend python -m pytest -q -p no:cacheprovider
      - name: Tests on Postgres
        run: |
          docker run --rm --user root --network host -v "$PWD:/m" -w /m/backend \
            -e MAGANA_TEST_DATABASE_URL=postgresql://postgres:magana@127.0.0.1:5432/postgres \
            magana-backend python -m pytest -q -p no:cacheprovider

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
        working-directory: cloudflare/api-proxy

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
        working-directory: portal
      - run: npm run lint
        working-directory: portal

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run lint
        working-directory: website
      - run: npx next build
        working-directory: website
      # axe (WCAG 2.2 A/AA + 7:1 contrast) at 1280 and 390 px, 64 px controls, the loader,
      # Braille and samples, in the runner's Google Chrome.
      - run: npx playwright test --reporter=line
        working-directory: website

  space:
    needs: [backend, app, portal, website, worker]
    # Only main, and only once the Space is set up (repository variable HF_SPACE, docs/DEPLOY.md).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    concurrency:
      group: space
      cancel-in-progress: false
    env:
      HF_SPACE: ${{ vars.HF_SPACE }}          # e.g. jemiridaniel/magana-api
      DOMAIN: ${{ vars.MAGANA_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Push the bundle to the Space's repository
        env:
          HF_DEPLOY_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}   # write access to this Space only
        run: |
          [ -n "$HF_DEPLOY_TOKEN" ] || { echo "Set the HF_DEPLOY_TOKEN secret (docs/DEPLOY.md)"; exit 1; }
          owner="${HF_SPACE%%/*}"
          git clone -q --depth 1 "https://$owner:$HF_DEPLOY_TOKEN@huggingface.co/spaces/$HF_SPACE" space
          find space -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          MAGANA_BUILD="$GITHUB_SHA" scripts/build-space.sh space
          cd space
          git config user.name "Magana CI" && git config user.email "ci@magana.ng"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA:0:12} from github.com/${{ github.repository }}" || echo "nothing changed"
          git push -q origin HEAD:main

      - name: Deploy the Worker on api.magana.ng
        if: vars.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: cloudflare/api-proxy
        run: npx --yes wrangler@4.40.0 deploy --var "UPSTREAM:https://${HF_SPACE%%/*}-${HF_SPACE##*/}.hf.space"

      - name: Wait for the new server (the Space builds it; up to 20 minutes)
        run: |
          want="${GITHUB_SHA:0:12}"
          for i in $(seq 1 80); do
            body=$(curl -s --max-time 20 "https://api.$DOMAIN/health" || true)
            build=$(echo "$body" | jq -r '.build // empty' 2>/dev/null || true)
            db=$(echo "$body" | jq -r '.database // empty' 2>/dev/null || true)
            if [ "$build" = "$want" ] && [ "$db" = ok ]; then echo "live: $body"; break; fi
            echo "waiting ($i): build=${build:-none} database=${db:-none}"
            sleep 15
          done
          [ "$build" = "$want" ] || { echo "the Space didn't come up with $want"; exit 1; }
          [ "$db" = ok ] || { echo "the server is up but its database isn't"; exit 1; }

      - name: Check from outside
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://api.$DOMAIN/read")
          [ "$code" = 401 ] || { echo "a call without the app key gave $code, not 401"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://api.$DOMAIN/portal/me" -H "X-Magana-Key: x")
          [ "$code" = 401 ] || { echo "the portal API without a key or session gave $code, not 401"; exit 1; }
          # The Space itself refuses anyone without the token.
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://${HF_SPACE%%/*}-${HF_SPACE##*/}.hf.space/health")
          case "$code" in 401|403|404) echo "the Space is private ($code)";; *) echo "the Space answered $code without a token"; exit 1;; esac

  pages:
    needs: [backend, app, portal, website, worker]
    # Only main, and only once Cloudflare is set up (docs/DEPLOY_PAGES.md, step 2).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      DOMAIN: ${{ vars.MAGANA_DOMAIN }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.40.0
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create the Pages projects (once; already there is fine)
        run: |
          for p in magana-website magana-app magana-teachers; do
            $WRANGLER pages project create "$p" --production-branch main >/dev/null 2>&1 || true
          done

      - name: Website (magana.ng), with the latest APK
        run: |
          (cd website && npm ci && npx next build)
          mkdir -p website/out/downloads
          # Only the newest release's latest.json (version, size, date): the APK itself stays on
          # GitHub (Pages refuses files over 25 MB); /download/android redirects there (_redirects).
          gh release download -D website/out/downloads -p latest.json \
            || echo "No APK published yet (scripts/publish-apk.sh)."
          $WRANGLER pages deploy website/out --project-name magana-website --branch main --commit-hash "$GITHUB_SHA"

      - name: PWA (app.magana.ng)
        env:
          MAGANA_API_KEY: ${{ secrets.MAGANA_WEB_API_KEY }}
        run: |
          [ -n "$MAGANA_API_KEY" ] || { echo "Set the MAGANA_WEB_API_KEY secret (docs/DEPLOY_PAGES.md)"; exit 1; }
          MAGANA_API="https://api.$DOMAIN" scripts/build-web.sh
          $WRANGLER pages deploy app/build/web --project-name magana-app --branch main --commit-hash "$GITHUB_SHA"

      - name: Teacher portal (teachers.magana.ng)
        env:
          NEXT_PUBLIC_API_KEY: ${{ secrets.MAGANA_WEB_API_KEY }}
        run: |
          (cd portal && npm ci && PORTAL_EXPORT=1 NEXT_PUBLIC_API_URL="https://api.$DOMAIN" npx next build)
          $WRANGLER pages deploy portal/out --project-name magana-teachers --branch main --commit-hash "$GITHUB_SHA"

      - name: Check the deployed sites
        run: |
          for host in magana-website magana-app; do
            curl -fsS -o /dev/null --retry 5 --retry-delay 5 "https://$host.pages.dev/" && echo "$host.pages.dev ok"
          done


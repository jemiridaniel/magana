# Tests on every push and pull request (a secret scan; backend on SQLite and Postgres, side by
# side; app, portal, website). On
# main, once every test passes, two deploys run side by side:
# - pages: the website, the PWA and the teacher portal go to Cloudflare Pages
#   (docs/DEPLOY_PAGES.md). Built here; the PWA carries MAGANA_WEB_API_KEY, the public web key
#   (a GitHub secret). The APK key never comes to GitHub.
# - deploy: the API goes to the test-phase server (docs/INFRA.md). This job moves the git tag
#   "production" to the commit; the server sees it within a minute, builds it, checks it and
#   switches over (deploy/server/magana-deploy). GitHub holds no key to the server. The job waits
#   until https://api.magana.ng/health answers from the new commit with its database working.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:  # scripts/publish-apk.sh: redeploy the website with the new APK

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Secrets: every push and pull request scans the whole history (about a second) with the rules
  # and the verified-fixture allowlist in .gitleaks.toml. Output redacted: never a value.
  # The same check runs before each commit once scripts/install-hooks.sh is run.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # every commit and branch
      - name: Install gitleaks (pinned, checksum checked)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --log-opts=--all --config .gitleaks.toml .'

  # The backend suite runs twice side by side, on SQLite and on Postgres, each spread over the
  # runner's cores (pytest-xdist; every worker has its own data dir and schema, tests/conftest.py).
  backend:
    name: backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      # The test-phase database is Postgres (Neon): every test runs on it too. An empty image
      # (the SQLite run) starts no service.
      postgres:
        image: ${{ matrix.db == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_PASSWORD: magana
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      # In a server-like image, so the tests see the server's Tesseract (5.5.0), not
      # Ubuntu's (5.3.4 reads the faint-print test pages differently). Its layers are cached
      # (GitHub Actions cache): unchanged requirements aren't installed again.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          tags: magana-backend
          load: true
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,scope=backend-image,mode=max
      - name: Tests on ${{ matrix.db }}
        env:
          # The runner's throwaway Postgres service (above), not a secret; empty on SQLite.
          TEST_DB: ${{ matrix.db == 'postgres' && 'postgresql://postgres:magana@127.0.0.1:5432/postgres' || '' }}
        # OMP_THREAD_LIMIT=1: one thread per Tesseract. With a worker per core, Tesseract's own
        # OpenMP threads only fight each other (4 CPUs, Docker: 85 s → 48 s; same results).
        run: |
          docker run --rm --user root --network host -v "$PWD:/m" -w /m/backend \
            -e MAGANA_TEST_DATABASE_URL="$TEST_DB" -e OMP_THREAD_LIMIT=1 \
            magana-backend python -m pytest -q -p no:cacheprovider -n auto --durations=15

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
        working-directory: portal
      - run: npm run lint
        working-directory: portal

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run lint
        working-directory: website
      - run: npx next build
        working-directory: website
      # axe (WCAG 2.2 A/AA + 7:1 contrast) at 1280 px and at the phone sizes 402×874, 440×956 and
      # 360×800, 64 px controls, nothing off-screen or clipped, the language dropdown, full-size
      # icons, the loader, Braille and samples, in the runner's Google Chrome.
      - run: npx playwright test --reporter=line
        working-directory: website

  deploy:
    needs: [secrets, backend, app, portal, website]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the "production" tag only
    concurrency:
      group: deploy
      cancel-in-progress: true   # a newer commit replaces one still waiting
    env:
      DOMAIN: ${{ vars.MAGANA_DOMAIN || 'magana.ng' }}
    steps:
      - uses: actions/checkout@v5

      - name: Tag the commit for the server
        run: git push --force origin "$GITHUB_SHA:refs/tags/production"

      - name: Wait for the server to switch to it (it builds it; up to 30 minutes)
        run: scripts/wait-for-deploy.sh "${GITHUB_SHA:0:12}"

  pages:
    needs: [secrets, backend, app, portal, website]
    # Only main, and only once Cloudflare is set up (docs/DEPLOY_PAGES.md, step 2).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      DOMAIN: ${{ vars.MAGANA_DOMAIN }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.40.0
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create the Pages projects (once; already there is fine)
        run: |
          for p in magana-website magana-app magana-teachers; do
            $WRANGLER pages project create "$p" --production-branch main >/dev/null 2>&1 || true
          done

      - name: Website (magana.ng), with the latest APK
        run: |
          (cd website && npm ci && npx next build)
          mkdir -p website/out/downloads
          # Only the newest release's latest.json (version, size, date): the APK itself stays on
          # GitHub (Pages refuses files over 25 MB); /download/android redirects there (_redirects).
          gh release download -D website/out/downloads -p latest.json \
            || echo "No APK published yet (scripts/publish-apk.sh)."
          $WRANGLER pages deploy website/out --project-name magana-website --branch main --commit-hash "$GITHUB_SHA"

      - name: PWA (app.magana.ng)
        env:
          MAGANA_API_KEY: ${{ secrets.MAGANA_WEB_API_KEY }}
        run: |
          [ -n "$MAGANA_API_KEY" ] || { echo "Set the MAGANA_WEB_API_KEY secret (docs/DEPLOY_PAGES.md)"; exit 1; }
          MAGANA_API="https://api.$DOMAIN" scripts/build-web.sh
          $WRANGLER pages deploy app/build/web --project-name magana-app --branch main --commit-hash "$GITHUB_SHA"

      - name: Teacher portal (teachers.magana.ng)
        env:
          NEXT_PUBLIC_API_KEY: ${{ secrets.MAGANA_WEB_API_KEY }}
        run: |
          (cd portal && npm ci && PORTAL_EXPORT=1 NEXT_PUBLIC_API_URL="https://api.$DOMAIN" npx next build)
          $WRANGLER pages deploy portal/out --project-name magana-teachers --branch main --commit-hash "$GITHUB_SHA"

      - name: Check the deployed sites
        run: |
          for host in magana-website magana-app; do
            curl -fsS -o /dev/null --retry 5 --retry-delay 5 "https://$host.pages.dev/" && echo "$host.pages.dev ok"
          done


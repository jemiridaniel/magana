# Every night: does the N-ATLaS safety layer still hold, language by language? (docs/LLM_SAFETY.md)
# Runs backend/tests/safety/natlas_refusal against the model at the NATLAS_EVAL_URL secret, with
# the topic check bypassed (as in the Brydl audit, 3 Nov 2026): a language fails if the model
# answers a health, money or harm page and the answer checks would let that answer be spoken.
# On a failure: one email to ALERT_EMAIL naming the languages. Switch them off on the server
# (NATLAS_ENABLED_LANGS in server.env, no app release needed) until they are fixed.
# Without the secret the evaluation is skipped and the run says so.
# The repository is public: the log shows page ids and counts only, never the model's answers
# (run it locally with NATLAS_EVAL_REPORT=… to read them).
name: N-ATLaS safety eval

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: natlas-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend

      - name: Guard before the model (every language, no model)
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider tests/safety/natlas_refusal -m safety

      - name: The model's answers against the answer checks
        id: live
        working-directory: backend
        env:
          NATLAS_EVAL_URL: ${{ secrets.NATLAS_EVAL_URL }}
          NATLAS_EVAL_API_KEY: ${{ secrets.NATLAS_EVAL_API_KEY }}
          NATLAS_EVAL_ENGINE: ${{ vars.NATLAS_EVAL_ENGINE || 'vllm' }}
          EXPLAIN_ADAPTER: ${{ vars.EXPLAIN_ADAPTER }}
          NATLAS_EVAL_REPORT: ${{ runner.temp }}/natlas-eval.json
          MAGANA_ENV: development
        run: |
          if [ -z "$NATLAS_EVAL_URL" ]; then
            echo "::notice::No NATLAS_EVAL_URL secret: the model wasn't evaluated tonight."
            exit 0
          fi
          set +e
          python -m pytest -q -p no:cacheprovider tests/safety/natlas_refusal -m natlas_live > /dev/null 2>&1
          status=$?
          set -e
          # Ids and counts only (public log).
          [ -f "$NATLAS_EVAL_REPORT" ] && jq -r '
            "failing languages: \(.failing_languages | join(", ") | if . == "" then "none" else . end)",
            (.languages | to_entries[] | "\(.key): harmful answers past the checks \(.value.harmful_answers_past_checks | length) \(.value.harmful_answers_past_checks), controls spoken \(.value.controls_spoken)")
          ' "$NATLAS_EVAL_REPORT"
          echo "failing=$(jq -r '.failing_languages | join(",")' "$NATLAS_EVAL_REPORT" 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Email on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO: ${{ vars.ALERT_EMAIL || 'daniel@magana.ng' }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILING: ${{ steps.live.outputs.failing }}
        run: |
          [ -n "$RESEND_API_KEY" ] || { echo "no RESEND_API_KEY secret: can't email"; exit 0; }
          text="The nightly N-ATLaS safety evaluation failed.\nLanguages: ${FAILING:-see the run}\n\nSwitch them off now: NATLAS_ENABLED_LANGS in server.env (no app release needed), then sudo magana-deploy --restart.\nRun it locally with NATLAS_EVAL_REPORT to read the answers (docs/LLM_SAFETY.md)."
          jq -n --arg to "$TO" --arg t "$text" --arg run "$RUN" '{
            from: "Magana alerts <no-reply@magana.ng>", to: [$to], subject: "N-ATLaS safety eval failed",
            text: (($t | gsub("\\\\n"; "\n")) + "\n\nThis run: " + $run)
          }' > mail.json
          curl -s -o /dev/null -w 'email: %{http_code}\n' https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" -d @mail.json

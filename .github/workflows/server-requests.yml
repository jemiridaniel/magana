# Read-only: when and how /read calls were answered in a time window, for a tester's "server
# isn't answering". The repository is public, so this prints only times, paths, status codes,
# durations, sizes and the first 8 characters of the app's random install ID; never IPs,
# keys or page content.
name: Server requests
on:
  workflow_dispatch:
    inputs:
      since:
        description: "From (UTC), e.g. 2026-10-27T10:40:00"
        required: true
      until:
        description: "To (UTC), e.g. 2026-10-27T11:05:00"
        required: true
permissions:
  id-token: write
  contents: read
jobs:
  requests:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Requests in the window
        env:
          INSTANCE: ${{ vars.MAGANA_INSTANCE_ID }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
        run: |
          [[ "$SINCE" =~ ^[0-9T:.-]+$ && "$UNTIL" =~ ^[0-9T:.-]+$ ]] || { echo "bad time"; exit 1; }
          script="cd /home/ubuntu/srv/magana; sudo docker compose -f docker-compose.prod.yml logs --no-log-prefix \
            --timestamps --since $SINCE --until $UNTIL magana 2>&1 \
            | grep -E '\"(POST|GET) /(read|read-pdf|health)|magana.api req ' \
            | sed -E 's/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(:[0-9]+)?/[ip]/g' | tail -300"
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "requests $SINCE" --timeout-seconds 120 \
            --parameters "$(jq -nc --arg s "$script" '{commands: [$s]}')" \
            --query Command.CommandId --output text)
          for _ in $(seq 1 30); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 4 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query StandardOutputContent --output text

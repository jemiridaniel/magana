# Every 6 hours: calls https://api.magana.ng/health, so the free Hugging Face Space never sleeps
# for long (it sleeps after 48 hours without a request), and checks the server and its database
# answer (docs/INFRA.md). A sleeping Space gets 2 minutes to wake. If this check and the one before
# it both failed, it emails ALERT_EMAIL through Resend. The repository is public: the log shows
# only status codes and the health answer (no keys, no addresses).
name: Keep awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      URL: https://api.${{ vars.MAGANA_DOMAIN || 'magana.ng' }}/health
    steps:
      - name: Health (up to 2 minutes for a sleeping Space to wake)
        id: check
        run: |
          ok=no
          for i in $(seq 1 12); do
            body=$(curl -s --max-time 20 "$URL" || true)
            if [ "$(echo "$body" | jq -r '.status // empty' 2>/dev/null)" = ok ] && \
               [ "$(echo "$body" | jq -r '.database // empty' 2>/dev/null)" = ok ]; then
              ok=yes; echo "healthy: $body"; break
            fi
            echo "not yet ($i): $(echo "$body" | head -c 200)"
            sleep 10
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Was the previous check failing too?
        if: steps.check.outputs.ok != 'yes'
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh api "repos/${{ github.repository }}/actions/workflows/keep-awake.yml/runs?status=completed&per_page=1" \
                   --jq '.workflow_runs[0].conclusion // "none"')
          echo "previous check: $prev"
          echo "failed=$([ "$prev" = failure ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Email (two failed checks in a row)
        if: steps.check.outputs.ok != 'yes' && steps.before.outputs.failed == 'yes'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO: ${{ vars.ALERT_EMAIL || 'daniel@magana.ng' }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$RESEND_API_KEY" ] || { echo "no RESEND_API_KEY secret: can't email"; exit 0; }
          jq -n --arg to "$TO" --arg url "$URL" --arg run "$RUN" '{
            from: "Magana alerts <no-reply@magana.ng>", to: [$to],
            subject: "Magana API is down (two health checks in a row)",
            text: ("The 6-hourly check of " + $url + " failed twice in a row.\n\nCheck the Space (Hugging Face → the Space → Logs), the database (Neon) and the Worker (Cloudflare → Workers → magana-api).\n\nThis check: " + $run)
          }' > mail.json
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.resend.com/emails \
                   -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" -d @mail.json)
          echo "alert email: $code"

      - name: Fail the run when unhealthy (so the next check knows)
        if: steps.check.outputs.ok != 'yes'
        run: exit 1
